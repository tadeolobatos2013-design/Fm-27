<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Fútbol FM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Concepto: marcador de estadio sobre césped nocturno. Verde pasto + oro de trofeo. Barlow Condensed para marcadores y títulos, Barlow para lectura. */
:root {
  --bg: #0b1511; --panel: #12201a; --panel2: #1a2c23; --line: #28403399; --line2: #2c4639; --fg: #e9f2ec; --mut: #8fa89a;
  --acc: #35d07f; --acc-ink: #04140b; --gold: #f3c24a; --bad: #ff6159; --warn: #f0a23b; --blue: #5aa7ff; --grass1: #14301f; --grass2: #112a1a;
  --f-d: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif; --f-b: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef4ef; --panel: #ffffff; --panel2: #e6efe9; --line: #c7d6cc; --line2: #bccbc1; --fg: #12241a; --mut: #566f61;
  --acc: #0f8a4c; --acc-ink: #ffffff; --gold: #9a6f00; --bad: #c9302c; --warn: #a45f00; --blue: #1d65c4; --grass1: #d7ead9; --grass2: #cfe4d2; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #eef4ef; --panel: #ffffff; --panel2: #e6efe9; --line: #c7d6cc; --line2: #bccbc1; --fg: #12241a; --mut: #566f61;
  --acc: #0f8a4c; --acc-ink: #ffffff; --gold: #9a6f00; --bad: #c9302c; --warn: #a45f00; --blue: #1d65c4; --grass1: #d7ead9; --grass2: #cfe4d2; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-b); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
#app { max-width: 1080px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-d); font-weight: 700; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h2 { font-size: 24px; } h3 { font-size: 18px; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); font-weight: 600; }
p { margin: 0 0 10px; } .mut { color: var(--mut); } .sm { font-size: 13px; } .num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.btn { border: 1px solid var(--line2); background: var(--panel2); color: var(--fg); padding: 9px 14px; border-radius: 8px; font-weight: 600; min-height: 40px; }
.btn:hover { border-color: var(--acc); }
.btn.pri { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; } .row.sp { justify-content: space-between; }
.grid { display: grid; gap: 12px; } .g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } .g3 { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; padding: 14px; min-width: 0; }
.card > h3 { margin-bottom: 10px; }
.stack { display: grid; gap: 12px; }
input[type=text], input[type=number], input[type=search], select, textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; min-height: 38px; max-width: 100%; }
input[type=color] { padding: 2px; width: 46px; height: 38px; border: 1px solid var(--line2); border-radius: 8px; background: var(--bg); }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
label.f input, label.f select { text-transform: none; letter-spacing: 0; color: var(--fg); font-size: 15px; }
.scroll { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line2); white-space: nowrap; }
.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t tr.me td { background: color-mix(in srgb, var(--acc) 14%, transparent); font-weight: 600; }
.t tr.click { cursor: pointer; } .t tr.click:hover td { background: var(--panel2); }
.t td.r, .t th.r { text-align: right; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line2); vertical-align: -1px; margin-right: 6px; flex: none; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--panel2); border: 1px solid var(--line2); }
.pill.ok { color: var(--acc); border-color: var(--acc); } .pill.bad { color: var(--bad); border-color: var(--bad); } .pill.warn { color: var(--warn); border-color: var(--warn); } .pill.gold { color: var(--gold); border-color: var(--gold); }
.ovr { display: inline-grid; place-items: center; min-width: 30px; height: 24px; border-radius: 5px; font-family: var(--f-d); font-weight: 700; font-size: 15px; background: var(--panel2); border: 1px solid var(--line2); }
.ovr.a { background: var(--gold); color: #231a00; border-color: var(--gold); } .ovr.b { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); } .ovr.c { background: var(--panel2); }
.bar { height: 6px; border-radius: 4px; background: var(--panel2); overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--acc); }
.bar.rep > i { background: var(--gold); }
/* cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line2); margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 16px calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.top .bar1 { display: flex; align-items: center; gap: 12px; justify-content: space-between; max-width: 1080px; margin: 0 auto; }
.brand { white-space: nowrap; font-family: var(--f-d); font-weight: 700; font-size: 22px; letter-spacing: .06em; } .brand b { color: var(--acc); }
.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 1080px; margin: 4px auto 0; scrollbar-width: none; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font-weight: 600; color: var(--mut); white-space: nowrap; }
.tabs button.on { color: var(--fg); border-color: var(--acc); }
.chip { background: var(--panel2); border: 1px solid var(--line2); border-radius: 99px; padding: 3px 11px; font-size: 13px; font-weight: 600; }
.chip.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.hero { border-radius: 16px; border: 1px solid var(--line2); padding: 28px 20px; background: repeating-linear-gradient(90deg, var(--grass1) 0 56px, var(--grass2) 56px 112px); position: relative; overflow: hidden; }
.hero h1 { font-size: clamp(44px, 9vw, 84px); line-height: .92; letter-spacing: .03em; }
.hero h1 b { color: var(--acc); }
.menu { display: grid; gap: 10px; max-width: 360px; margin-top: 18px; }
.menu .btn { text-align: left; padding: 12px 16px; font-size: 16px; }
/* partido */
.board { background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 1px solid var(--line2); border-radius: 14px; padding: 14px 12px; }
.score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; }
.score .tm { font-family: var(--f-d); font-weight: 700; font-size: clamp(16px, 3.6vw, 26px); text-transform: uppercase; letter-spacing: .04em; min-width: 0; overflow-wrap: anywhere; }
.score .res { font-family: var(--f-d); font-weight: 700; font-size: clamp(44px, 11vw, 78px); line-height: 1; font-variant-numeric: tabular-nums; }
.clock { text-align: center; font-family: var(--f-d); font-size: 22px; color: var(--gold); letter-spacing: .1em; margin-top: 6px; }
.feed { list-style: none; margin: 0; padding: 0; max-height: 440px; overflow-y: auto; display: grid; gap: 0; }
.feed li { display: grid; grid-template-columns: 52px 1fr; gap: 6px; padding: 7px 4px; border-bottom: 1px solid var(--line); align-items: baseline; }
.feed li .mn { font-family: var(--f-d); font-weight: 700; color: var(--mut); font-size: 16px; }
.feed li.goal { background: color-mix(in srgb, var(--acc) 15%, transparent); font-weight: 600; } .feed li.red { color: var(--bad); } .feed li.ht, .feed li.ft, .feed li.ko { color: var(--gold); font-weight: 600; }
.feed li.chat, .feed li.miss, .feed li.corner { color: var(--mut); }
.sbar { display: grid; grid-template-columns: 1fr 90px 1fr; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; font-variant-numeric: tabular-nums; }
.sbar .mid { text-align: center; color: var(--mut); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.sbar .l { text-align: right; } .sbar .l, .sbar .rr { font-weight: 600; }
.pitch { background: repeating-linear-gradient(0deg, var(--grass1) 0 34px, var(--grass2) 34px 68px); border: 1px solid var(--line2); border-radius: 12px; padding: 10px 6px; display: grid; gap: 10px; }
.line { display: flex; justify-content: space-around; gap: 4px; }
.pl { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 5px 4px; text-align: center; min-width: 64px; max-width: 110px; flex: 1; font-size: 12px; line-height: 1.2; cursor: pointer; position: relative; }
.pl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; } .pl .ps { color: var(--mut); font-size: 11px; }
.pl.sel { outline: 2px solid var(--gold); } .pl.out { opacity: .5; text-decoration: line-through; } .pl.bad { border-color: var(--bad); }
.pl .ovr { margin-top: 2px; }
.ovl { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 16px; width: min(640px, 100%); max-height: 88vh; overflow: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 60; max-width: min(92vw, 520px); text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
.offer { display: grid; gap: 6px; } .offer .nm { font-family: var(--f-d); font-size: 22px; font-weight: 700; }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); }
.form5 { display: inline-flex; gap: 3px; } .form5 i { width: 16px; height: 16px; border-radius: 4px; font-style: normal; font-size: 10px; display: grid; place-items: center; font-weight: 700; color: #04140b; }
.form5 .W { background: var(--acc); } .form5 .D { background: var(--warn); } .form5 .L { background: var(--bad); color: #fff; }
.zone-c { box-shadow: inset 3px 0 0 var(--blue); } .zone-e { box-shadow: inset 3px 0 0 var(--gold); }
.ed-list { max-height: 520px; overflow: auto; }
details.dt summary { cursor: pointer; font-weight: 600; }
@media (max-width: 560px) { .hide-s { display: none; } .t td, .t th { padding: 6px 5px; } .card { padding: 11px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* FUTBOL FM – núcleo: utilidades, RNG, formaciones, generador de plantillas y sistema de packs/mods.
 * Licencia MIT. Funciona en navegador y en Node (para las pruebas). */
(function () {
  'use strict';
  const FM = (globalThis.FM = globalThis.FM || {});
  FM.version = '1.0.0';
  FM.packs = FM.packs || {}; // id -> pack crudo (JSON)

  /* ---------- RNG determinista (mulberry32) ---------- */
  let _s = 123456789;
  FM.seed = (n) => { _s = (n >>> 0) || 1; };
  FM.rngState = () => _s;
  FM.rand = () => {
    _s = (_s + 0x6D2B79F5) | 0;
    let t = _s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const rand = FM.rand;
  FM.rint = (a, b) => a + Math.floor(rand() * (b - a + 1));
  FM.pick = (arr) => arr[Math.floor(rand() * arr.length)];
  FM.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  FM.gauss = () => { let u = 0; for (let i = 0; i < 4; i++) u += rand(); return (u - 2) * 1.7; };
  FM.shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  FM.wpick = (items, wf) => {
    let tot = 0; const ws = items.map((x) => { const w = Math.max(0, wf(x)); tot += w; return w; });
    if (tot <= 0) return items[Math.floor(rand() * items.length)];
    let r = rand() * tot;
    for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  };
  FM.hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  FM.slug = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  FM.clone = (o) => JSON.parse(JSON.stringify(o));
  const { rint, pick, clamp, gauss } = FM;

  /* ---------- Posiciones y formaciones ---------- */
  FM.POS = ['GK', 'CB', 'LB', 'RB', 'DM', 'CM', 'AM', 'LM', 'RM', 'LW', 'RW', 'ST'];
  FM.LINE = { GK: 0, CB: 1, LB: 1, RB: 1, DM: 2, CM: 2, AM: 2, LM: 2, RM: 2, LW: 3, RW: 3, ST: 3 };
  FM.GROUP = (pos) => ({ 0: 'GK', 1: 'DF', 2: 'MF', 3: 'FW' }[FM.LINE[pos]]);
  FM.FORMATIONS = {
    '4-3-3': ['GK', 'LB', 'CB', 'CB', 'RB', 'CM', 'DM', 'CM', 'LW', 'ST', 'RW'],
    '4-4-2': ['GK', 'LB', 'CB', 'CB', 'RB', 'LM', 'CM', 'CM', 'RM', 'ST', 'ST'],
    '4-2-3-1': ['GK', 'LB', 'CB', 'CB', 'RB', 'DM', 'DM', 'LW', 'AM', 'RW', 'ST'],
    '3-5-2': ['GK', 'CB', 'CB', 'CB', 'LM', 'CM', 'DM', 'CM', 'RM', 'ST', 'ST'],
    '5-3-2': ['GK', 'LB', 'CB', 'CB', 'CB', 'RB', 'CM', 'DM', 'CM', 'ST', 'ST'],
    '4-1-4-1': ['GK', 'LB', 'CB', 'CB', 'RB', 'DM', 'LM', 'CM', 'CM', 'RM', 'ST'],
  };

  /* ---------- Economía ---------- */
  // Presupuesto de fichajes (M€) a partir de la reputación del club (0-100)
  FM.repToBudget = (rep) => Math.round(6 * Math.exp(0.093 * (rep - 50)) * 10) / 10;
  // Valor de mercado (M€)
  FM.valueOf = (p) => {
    let eff = p.ovr;
    if (p.age < 24) eff += Math.max(0, p.pot - p.ovr) * 0.5;
    let v = 1.5 * Math.exp(0.1535 * (eff - 60));
    if (p.age >= 33) v *= 0.35; else if (p.age >= 31) v *= 0.6; else if (p.age >= 29) v *= 0.85;
    v = Math.max(0.05, v);
    return v < 10 ? Math.round(v * 10) / 10 : Math.round(v);
  };
  FM.askPrice = (p) => (p.club ? Math.max(0.1, Math.round(FM.valueOf(p) * 1.15 * 10) / 10) : 0);
  FM.fmtM = (v) => (v >= 100 ? Math.round(v) : v >= 10 ? (Math.round(v * 10) / 10) : (Math.round(v * 100) / 100)) + ' M€';

  /* ---------- Nombres para jugadores generados ---------- */
  const S = (x) => x.split(/\s+/);
  const NAMES = {
    ENG: [S('Jack Harry Oliver George Charlie Jamie Tom Ben Luke Ryan Callum Josh Connor Liam Mason Declan Reece Kyle Ollie Sam Alfie Max Joe Danny'),
      S('Smith Taylor Walker Wright Hughes Clarke Turner Bennett Fletcher Hayes Palmer Griffin Harrison Barnes Cooper Mitchell Ward Foster Hunt Marshall Webb Burke Dixon Holland Pearce Sutton Rowe Stone Bishop Lloyd')],
    ESP: [S('Álvaro Pablo Javier Sergio Raúl Iván Adrián Hugo Diego Mario Rubén Carlos Marcos Alejandro Samuel Aitor Unai Iker Joel Nacho Borja Dani Ismael Rafa'),
      S('García Martínez López Sánchez Pérez Gómez Ruiz Díaz Hernández Moreno Navarro Romero Torres Domínguez Vega Castro Ortega Rubio Molina Delgado Iglesias Medina Santos Cabrera Gil Prieto Campos Núñez Ramos Serrano')],
    ITA: [S('Marco Luca Matteo Andrea Federico Davide Simone Riccardo Alessio Gianluca Nicolò Lorenzo Fabio Daniele Stefano Giacomo Emanuele Mattia Leonardo Tommaso Diego Paolo Filippo Claudio'),
      S('Rossi Russo Ferrari Esposito Bianchi Romano Colombo Ricci Marino Greco Bruno Gallo Conti Costa Giordano Mancini Rizzo Lombardi Moretti Barbieri Fontana Santoro Mariani Rinaldi Caruso Ferrara Galli Martini')],
    GER: [S('Lukas Jonas Felix Leon Niklas Tim Jan Moritz Florian Fabian Maximilian Kevin Julian Marvin Philipp Tobias Sebastian Nico Robin Dominik Patrick Marcel Lars Finn'),
      S('Müller Schmidt Schneider Fischer Weber Meyer Wagner Becker Schulz Hoffmann Koch Richter Klein Wolf Schröder Neumann Schwarz Zimmermann Braun Krüger Hartmann Lange Werner Schmitt Krause Meier Lehmann Köhler')],
    FRA: [S('Lucas Hugo Théo Louis Mathis Nathan Enzo Tom Maxime Antoine Baptiste Clément Romain Julien Axel Yanis Alexis Benoît Florian Dylan Valentin Quentin Adrien Rémi Bastien'),
      S('Martin Bernard Dubois Thomas Robert Richard Petit Durand Leroy Moreau Simon Laurent Lefebvre Michel Garcia David Bertrand Roux Vincent Fournier Morel Girard André Mercier Dupont Lambert Bonnet François Legrand')],
    MEX: [S('Luis Jesús Miguel José Ángel Carlos Diego Fernando Héctor Rodrigo Erick Ricardo Omar Alan Brandon Jorge Cristian Emilio Víctor Gael Santiago Adolfo Édgar Efraín'),
      S('Hernández González Ramírez Flores Torres Rivera Morales Cruz Ortiz Gutiérrez Chávez Ruiz Jiménez Mendoza Vargas Castillo Aguilar Medina Rojas Salazar Guerrero Cortés Estrada Valdez Ibarra Escobar Zamora Rangel Pacheco Luna')],
    BRA: [S('Gabriel Matheus Pedro João Lucas Rafael Thiago Bruno Vinícius Caio Felipe Rodrigo Gustavo Leandro Wesley Igor Davi Yuri Samuel Diego Renan Arthur'),
      S('Silva Santos Oliveira Souza Pereira Costa Rodrigues Almeida Nascimento Lima Araújo Ribeiro Carvalho Gomes Martins Barbosa Moreira Cardoso Rocha Dias Teixeira Cavalcanti Monteiro Freitas Moura Campos Azevedo')],
  };
  const NAT_POOL = { ARG: 'ESP', COL: 'ESP', URU: 'ESP', POR: 'BRA', NED: 'GER', BEL: 'FRA' };
  const INTL = ['ENG', 'ESP', 'ITA', 'GER', 'FRA', 'BRA', 'ARG', 'MEX', 'POR', 'NED', 'BEL', 'COL', 'URU'];
  FM.genName = (nat) => {
    const key = NAMES[nat] ? nat : (NAT_POOL[nat] || 'ENG');
    const [f, l] = NAMES[key];
    return pick(f) + ' ' + pick(l);
  };
  FM.randNat = (local) => (rand() < 0.6 ? local : pick(INTL));

  /* ---------- Generador de jugadores ---------- */
  FM.baseOvr = (rep) => 66 + (rep - 50) * 0.43; // media del once titular según reputación
  FM.makePlayer = (id, club, pos, ovr, age, nat, name) => {
    ovr = clamp(Math.round(ovr), 35, 97);
    let pot;
    if (age <= 21) pot = ovr + rint(4, 14); else if (age <= 24) pot = ovr + rint(1, 7); else if (age <= 27) pot = ovr + rint(0, 3); else pot = ovr;
    pot = clamp(Math.round(pot), ovr, 94);
    return { id, name: name || FM.genName(nat), club, pos, age, ovr, pot, nat, gen: true };
  };
  // plantilla base de 24 [posición, esSuplente]
  const TEMPLATE = [['GK', 0], ['GK', 1], ['GK', 1], ['CB', 0], ['CB', 0], ['CB', 1], ['CB', 1], ['LB', 0], ['LB', 1], ['RB', 0], ['RB', 1],
    ['DM', 0], ['DM', 1], ['CM', 0], ['CM', 0], ['CM', 1], ['AM', 0], ['LW', 0], ['LW', 1], ['RW', 0], ['RW', 1], ['ST', 0], ['ST', 1], ['ST', 1]];

  /* ---------- Packs: resolver (extends/remove), validar y autocompletar ---------- */
  FM.registerPack = (raw) => {
    if (!raw || !raw.meta || !raw.meta.id) throw new Error('El pack necesita meta.id');
    FM.packs[raw.meta.id] = raw;
    return raw.meta.id;
  };

  FM.resolvePack = (raw, depth) => {
    depth = depth || 0;
    if (depth > 4) throw new Error('El pack "extends" es demasiado profundo');
    let p = FM.clone(raw);
    if (p.extends) {
      const baseRaw = FM.packs[p.extends];
      if (!baseRaw) throw new Error('Falta el pack base: ' + p.extends + ' (cárgalo primero)');
      const b = FM.resolvePack(baseRaw, depth + 1);
      const mergeBy = (A, B) => { const m = new Map((A || []).map((x) => [x.id, x])); (B || []).forEach((x) => m.set(x.id, Object.assign({}, m.get(x.id) || {}, x))); return [...m.values()]; };
      const out = { meta: Object.assign({}, b.meta, p.meta), leagues: mergeBy(b.leagues, p.leagues), clubs: mergeBy(b.clubs, p.clubs), players: mergeBy(b.players, p.players) };
      const rm = p.remove || {};
      if (rm.clubs) { const s = new Set(rm.clubs); out.clubs = out.clubs.filter((c) => !s.has(c.id)); out.players = out.players.filter((x) => !s.has(x.club)); }

  function roundRobin(ids) {

  /* ---------- Plantillas: relleno con juveniles ---------- */

  function removeFromClub(w, p) { if (p.club && w.clubs[p.club]) { const c = w.clubs[p.club]; c.squad = c.squad.filter((x) => x !== p.id); if (c.id !== w.user.club) { c.xi = null; c.bench = null; } } }

    if (to) { to.budget = Math.max(0, to.budget - fee); to.squad.push(pid); if (to.id !== w.user.club) { to.xi = null; to.bench = null; } }

    w.user.rep = clamp(Math.round(w.user.rep + diff * 0.7 + (pos === 1 ? 4 : 0) + (diff < 0 ? -1 : 1)), 15, 98);
    // ofertas
    const mr = w.user.rep; let cands = Object.values(w.clubs).filter((c) => c.id !== me.id && c.rep >= mr - 12 + (pos === 1 ? 4 : 0) && c.rep <= mr + 6 + (pos === 1 ? 4 : 0));
    if (cands.length < 2) cands = Object.values(w.clubs).filter((c) => c.id !== me.id).sort((a, b) => Math.abs(a.rep - mr) - Math.abs(b.rep - mr)).slice(0, 4);
    shuffle(cands);
    const top = cands.slice().sort((a, b) => b.rep - a.rep)[0];
    const chosen = [top]; for (const c of cands) { if (chosen.length >= rint(2, 4)) break; if (!chosen.includes(c)) chosen.push(c); }
    sum.offers = chosen.filter(Boolean).map((c) => { const l = w.leagues[c.league]; const cs = l.clubIds.slice().sort((a, b) => w.clubs[b].rep - w.clubs[a].rep).indexOf(c.id) + 1;
      return { club: c.id, league: l.name, rep: Math.round(c.rep), budget: c.budget, goal: cs <= 3 ? 'Pelear el título' : cs <= Math.ceil(l.clubIds.length / 2) ? 'Zona alta de la tabla' : 'Mantener la categoría', big: l.big }; });
    w.summary = sum;
    w.user.hist.push({ year: w.year, club: me.id, clubName: me.name, league: L.name, pos, n, pts: sum.pts, champ: st[0].id === me.id });
    news(w, 'Fin de temporada ' + w.year + ': ' + me.name + ' termina ' + pos + 'º en ' + L.name + '.');
    return sum;
  };

  function progress(w) {
    const retired = [];
    for (const p of Object.values(w.players)) {
      p.age++;
      let d;
      if (p.age <= 21) d = rint(1, 4); else if (p.age <= 24) d = rint(0, 3) - (rand() < 0.2 ? 1 : 0); else if (p.age <= 28) d = rint(-1, 1);
      else if (p.age <= 31) d = rint(-3, 0); else if (p.age <= 34) d = rint(-4, -1); else d = rint(-5, -2);
      if (d > 0) d = Math.min(d, Math.max(0, p.pot - p.ovr) + (rand() < 0.15 ? 1 : 0));
      p.ovr = clamp(p.ovr + d, 35, 97);
      p.pot = p.age >= 27 ? p.ovr : Math.max(p.ovr, clamp(p.pot + rint(-1, 1), 40, 97));
      p.inj = 0; p.susp = 0; p.fit = 100;
      const lim = p.pos === 'GK' ? 36 : 34;
      if (p.age >= 42 || (p.age > lim && rand() < (p.age - lim) * 0.28 + (p.ovr < 65 ? 0.3 : 0))) retired.push(p);
    }
    for (const p of retired) {
      if (p.ovr >= 82) news(w, 'Se retira ' + p.name + ' (' + p.age + ' años).');
      removeFromClub(w, p); delete w.players[p.id];
    }
    // límite del mercado de libres
    const free = Object.values(w.players).filter((p) => !p.club).sort((a, b) => b.ovr - a.ovr);
    for (const p of free.slice(120)) delete w.players[p.id];
  }
  function finances(w) {
    for (const L of Object.values(w.leagues)) {
      const st = FM.standings(w, L.id), n = st.length;
      st.forEach((r, i) => {
        const c = w.clubs[r.id]; const frac = n > 1 ? (n - 1 - i) / (n - 1) : 0.5;
        const base = FM.repToBudget(c.rep);
        c.inc = Math.round(base * 0.25 * (0.7 + 0.6 * frac) * 10) / 10;
        c.budget = Math.round(Math.min(base * 4 + 5, c.budget + c.inc) * 10) / 10;
        const exp = L.clubIds.slice().sort((a, b) => w.clubs[b].rep - w.clubs[a].rep).indexOf(r.id);
        c.rep = clamp(Math.round((c.rep + clamp((exp - i) * 0.12, -1.2, 1.2)) * 10) / 10, 25, 98);
      });
    }
  }
  // Paso 2: aplica oferta (o se queda) y arranca la siguiente temporada. Devuelve {ok,msg}.
  FM.beginNextSeason = (w, newClubId) => {
    const snapshot = JSON.stringify(w);
    try {
      FM.save(w);
      if (newClubId && w.clubs[newClubId]) { w.user.club = newClubId; news(w, 'Aceptas el cargo de entrenador de ' + w.clubs[newClubId].name + '.'); }
      finances(w);
      progress(w);
      for (const c of Object.values(w.clubs)) { topUp(w, c); if (c.id !== w.user.club) trimSquad(w, c); c.xi = null; c.bench = null; }
      w.year++; w.phase = 'preseason'; makeFixtures(w); w.summary = null;
      aiTransfers(w, 0.85);
      for (const c of Object.values(w.clubs)) { c.squad = c.squad.filter((id) => w.players[id]); }
      FM.fixLineup(w, w.clubs[w.user.club], true);
      const issues = FM.audit(w);
      news(w, 'Comienza la temporada ' + w.year + '/' + String(w.year + 1).slice(2) + '. Pretemporada: mercado abierto.');
      FM.save(w);
      return { ok: true, msg: 'Nueva temporada lista.', issues };
    } catch (e) {
      // Restaurar el mundo anterior: nunca dejar la partida a medias
      const old = JSON.parse(snapshot); for (const k of Object.keys(w)) delete w[k]; Object.assign(w, old);
      return { ok: false, msg: 'Error al cambiar de temporada (' + e.message + '). Se restauró tu partida; vuelve a intentarlo.' };
    }
  };
  FM.startSeason = (w) => { if (w.phase !== 'preseason') return; w.phase = 'season'; FM.fixLineup(w, w.clubs[w.user.club], false); FM.save(w); };

  /* ---------- Auditoría / autorreparación ---------- */
  FM.audit = (w) => {
    const issues = []; const owner = new Map();
    for (const c of Object.values(w.clubs)) {
      c.squad = c.squad.filter((id) => { if (!w.players[id]) { issues.push('Jugador fantasma en ' + c.id); return false; } if (owner.has(id)) { issues.push('Duplicado ' + id); return false; } owner.set(id, c.id); return true; });
      if (!isFinite(c.budget) || c.budget < 0) { issues.push('Presupuesto inválido ' + c.id); c.budget = Math.max(0, +c.budget || 0); if (!isFinite(c.budget)) c.budget = FM.repToBudget(c.rep); }
    }
    for (const p of Object.values(w.players)) {
      if (!isFinite(p.ovr) || !isFinite(p.age)) { issues.push('Valor inválido ' + p.id); p.ovr = isFinite(p.ovr) ? p.ovr : 60; p.age = isFinite(p.age) ? p.age : 25; }
      if (p.club && owner.get(p.id) !== p.club) { issues.push('Club inconsistente ' + p.id); p.club = owner.get(p.id) || null; }
    }
    return issues;
  };

  /* ---------- Guardado ---------- */
  FM.save = (w, key) => { try { w.rs = FM.rngState(); localStorage.setItem(key || SAVE_KEY, JSON.stringify(w)); return true; } catch (e) { return false; } };
  FM.load = (key) => { try { const s = localStorage.getItem(key || SAVE_KEY); if (!s) return null; const w = JSON.parse(s); FM.seed(w.rs || 1); return w; } catch (e) { return null; } };
  FM.hasSave = () => { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } };
  FM.exportSave = (w) => { w.rs = FM.rngState(); return JSON.stringify(w); };
  FM.importSave = (txt) => { const w = JSON.parse(txt); if (!w || !w.clubs || !w.players || !w.leagues) throw new Error('Archivo de partida inválido'); FM.seed(w.rs || 1); return w; };
})();

<script>
/* FUTBOL FM – soundtrack. Música generativa original (WebAudio, sin derechos de autor) + tu propia música (mp3/ogg/wav)
 * + ambiente de estadio, silbato y festejo de gol. El audio arranca con la primera interacción del usuario. */
(function () {
  'use strict';
  const FM = globalThis.FM;
  const A = (FM.audio = { mode: 'menu', muted: false, vol: 0.6, track: 0, own: [], ownIdx: -1, useOwn: false, ready: false, name: '' });
  let ctx, master, music, sfx, crowdG, timer, step = 0, nextT = 0, cur = null, el = null;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const CH = { M: [0, 4, 7], m: [0, 3, 7], '7': [0, 4, 7, 10], m7: [0, 3, 7, 10], M7: [0, 4, 7, 11] };
  // root = nota MIDI, q = calidad
  const TRACKS = [
    { name: 'Noche de Liga', bpm: 84, style: 'chill', prog: [[57, 'm7'], [53, 'M7'], [48, 'M7'], [55, '7']], mode: 'menu' },
    { name: 'Tiki-Taka', bpm: 76, style: 'chill', prog: [[48, 'M7'], [57, 'm7'], [50, 'm7'], [55, '7']], mode: 'menu' },
    { name: 'Final de Copa', bpm: 100, style: 'epic', prog: [[50, 'm'], [46, 'M'], [53, 'M'], [48, 'M']], mode: 'match' },
    { name: 'Derbi', bpm: 124, style: 'drive', prog: [[52, 'm'], [48, 'M'], [55, 'M'], [50, 'M']], mode: 'match' },
  ];

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = globalThis.AudioContext || globalThis.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.connect(ctx.destination);
    music = ctx.createGain(); music.gain.value = 0.55; music.connect(master);
    sfx = ctx.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    // ambiente de estadio: ruido filtrado
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let b = 0; for (let i = 0; i < len; i++) { b = (b + (Math.random() * 2 - 1) * 0.1) * 0.985; d[i] = b * 3; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 0.4;
    crowdG = ctx.createGain(); crowdG.gain.value = 0; src.connect(bp); bp.connect(crowdG); crowdG.connect(sfx); src.start();
    A.ready = true; applyVol();
    try { const s = JSON.parse(localStorage.getItem('futbolfm_audio') || '{}'); if (s.vol != null) A.vol = s.vol; if (s.muted != null) A.muted = s.muted; applyVol(); } catch (e) {}
    nextT = ctx.currentTime + 0.1; step = 0;

  }

  function persist() { try { localStorage.setItem('futbolfm_audio', JSON.stringify({ vol: A.vol, muted: A.muted })); } catch (e) {} }

  function tone(f, t, dur, type, g, lp) {
    const o = ctx.createOscillator(), v = ctx.createGain(); o.type = type; o.frequency.value = f;
    let out = o; if (lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); out = fl; }
    out.connect(v); v.connect(music);

    cheer() { if (!crowdG) return; const t = ctx.currentTime; crowdG.gain.cancelScheduledValues(t); crowdG.gain.setTargetAtTime(0.34, t, 0.1); crowdG.gain.setTargetAtTime(A._base || 0.05, t + 2.5, 0.8); },

  function deleteMod(id) { try { const a = JSON.parse(localStorage.getItem(MODS_KEY) || '[]').filter((p) => p.meta.id !== id); localStorage.setItem(MODS_KEY, JSON.stringify(a)); } catch (e) {} delete FM.packs[id]; delete S.exp[id]; }
  function expanded(id) {

  /* ---------- utilidades UI ---------- */
  let toastT;

  function copy(text) { try { return navigator.clipboard.writeText(text).then(() => toast('Copiado al portapapeles'), () => toast('No se pudo copiar: selecciona el texto manualmente')); } catch (e) { toast('No se pudo copiar: selecciona el texto manualmente'); } }

  const teamOvr = (w, c) => { if (!c.xi) return 0; const v = c.xi.map((id) => w.players[id]).filter(Boolean); return v.length ? v.reduce((s, p) => s + p.ovr, 0) / v.length : 0; };

<p class="mut sm" style="text-align:center">${fx.h === me.id ? 'Juegas en casa' : 'Juegas de visitante'} · Tu once: ${Math.round(teamOvr(w, me))} · Rival: ${Math.round(teamOvr(w, Object.assign({}, opp, { xi: FM.autoLineup(w, opp).xi })))}</p>
<div class="row" style="justify-content:center;margin-top:6px"><button class="btn pri" data-a="play" style="font-size:17px;padding:12px 22px">⚽ Jugar partido (≈1 min)</button><button class="btn" data-a="tab" data-id="squad">Alineación</button></div></div>` : '<div class="card">Sin partido esta jornada.</div>';

<div class="card"><h3>Últimos resultados</h3>${log.length ? '<div class="stack">' + log.map((r) => `<div class="row sp"><span>J${r.w + 1} · ${esc(w.clubs[r.h].short)} <b class="num">${r.hg}-${r.ag}</b> ${esc(w.clubs[r.a].short)}</span><span class="pill ${((r.h === me.id ? r.hg - r.ag : r.ag - r.hg) > 0) ? 'ok' : (r.hg === r.ag ? 'warn' : 'bad')}">${(r.h === me.id ? r.hg - r.ag : r.ag - r.hg) > 0 ? 'Victoria' : r.hg === r.ag ? 'Empate' : 'Derrota'}</span></div>`).join('') + '</div>' : '<p class="mut" style="margin:0">Aún no has jugado.</p>'}</div></div>

<div class="card"><h3>Resto de la jornada</h3><div class="grid g2" id="mb-oth" style="gap:4px 18px"></div></div></div>`;

  function paintMatch(full) {
    if (S.screen !== 'match' || !S.cur) return;
    const m = S.cur.userMatch; if (!m) return; const H = m.h, A = m.a;
    const pct = Math.round(m.i / m.tl.length * 100);
    const status = m.done ? 'FINAL' : S.paused && m.htPause ? 'DESCANSO' : (m.i === 0 ? 'ANTES DEL PITAZO' : m.lab);
    $('#mb-top').innerHTML = `<div class="score"><div class="tm">${dot(H.color)}${esc(H.name)}</div><div class="res">${H.score} - ${A.score}</div><div class="tm">${esc(A.name)}${dot(A.color)}</div></div><div class="clock">${status}</div><div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div>`;
    const ctl = $('#mb-ctl');
    if (S.ended) ctl.innerHTML = `<button class="btn pri" data-a="endmd" style="font-size:17px;padding:12px 22px">Continuar ▶</button>${m.mom ? `<span class="chip">⭐ Jugador del partido: ${esc(m.mom.name)} (${m.mom.rt})</span>` : ''}`;
    else ctl.innerHTML = `<button class="btn pri" data-a="pause">${S.paused ? '▶ Seguir' : '⏸ Pausa'}</button>${[1, 2, 4, 10].map((s) => `<button class="chip ${S.speed === s ? 'on' : ''}" data-a="speed" data-v="${s}">x${s}</button>`).join('')}<button class="btn" data-a="subs">🔁 Cambios (${5 - (H.user ? H : A).subsMade})</button><button class="btn" data-a="tact">Táctica</button>`;
    const feed = $('#mb-feed');
    if (full || m.ev.length !== S.evSeen) {
      S.evSeen = m.ev.length;
      feed.innerHTML = m.ev.slice(-70).reverse().map((e) => `<li class="${e.k}"><span class="mn">${e.m}</span><span>${esc(e.t)}</span></li>`).join('');
    }
    const tot = H.st.pos + A.st.pos || 1; const ph = Math.round(H.st.pos / tot * 100);
    const sr = (n, a, b) => `<div class="sbar"><span class="l">${a}</span><span class="mid">${n}</span><span class="rr">${b}</span></div>`;
    $('#mb-stats').innerHTML = '<h3>Estadísticas</h3>' + sr('Posesión', ph + '%', (100 - ph) + '%') + sr('Tiros', H.st.sh, A.st.sh) + sr('A puerta', H.st.sot, A.st.sot) + sr('Córners', H.st.co, A.st.co) + sr('Faltas', H.st.fo, A.st.fo) + sr('Amarillas', H.st.yc, A.st.yc) + sr('Rojas', H.st.rc, A.st.rc);
    const mine = H.user ? H : A;
    $('#mb-xi').innerHTML = `<h3>${esc(mine.name)} · en cancha</h3><div class="scroll"><table class="t"><tbody>${mine.on.map((p) => `<tr><td>${p.slot}</td><td>${esc(p.name)} ${p.yc ? '🟨' : ''}${p.g ? ' ⚽'.repeat(p.g) : ''}</td><td class="r">${ovrB(p.ovr)}</td><td style="width:70px"><div class="bar"><i style="width:${Math.max(4, Math.round(100 - p.fat * 1.1))}%;${p.fat > 40 ? 'background:var(--warn)' : ''}"></i></div></td></tr>`).join('')}</tbody></table></div>`;
    $('#mb-oth').innerHTML = S.cur.live.filter((x) => x !== m).map((x) => `<div class="row sp sm"><span>${esc(x.h.short)} <b class="num">${x.h.score}-${x.a.score}</b> ${esc(x.a.short)}</span><span class="mut">${x.done ? 'FIN' : x.lab}</span></div>`).join('');
  }
  function startMatch() {
    const w = S.w; if (!FM.nextFixtureOk) { /* noop */ }
    S.cur = FM.startMatchday(w); if (!S.cur.userMatch) { toast('No hay partido para tu club esta jornada.'); S.cur = null; return; }
    S.screen = 'match'; S.paused = false; S.ended = false; S.evSeen = 0; S.acc = 0; S.last = performance.now(); S.tickN = 0; S.speed = S.speed || 1;
    FM.audio.start(); FM.audio.setMode('match'); FM.audio.ambience(true); FM.audio.whistle();
    render(); clearInterval(S.timer); S.timer = setInterval(loop, 100);
  }
  function loop() {
    if (S.screen !== 'match' || !S.cur) { clearInterval(S.timer); return; }
    const now = performance.now(), dt = now - S.last; S.last = now;
    if (S.paused || S.ended || S.modal) return;
    S.acc += Math.min(dt, 3000) * S.speed;
    let n = 0;
    while (S.acc >= TICK_MS && n++ < 40) { S.acc -= TICK_MS; doTick(); if (S.paused || S.ended) break; }
    if (n) paintMatch(false);
  }
  function doTick() {
    const cur = S.cur, m = cur.userMatch; const before = m.ev.length, sb = m.h.score + m.a.score;
    const any = FM.tickMatchday(cur);
    for (let i = before; i < m.ev.length; i++) {
      const e = m.ev[i];
      if (e.k === 'goal') { const mine = (e.s === 'h' ? m.h : m.a).user; FM.audio.cheer(); if (!mine) { /* gol rival */ } }
      if (e.k === 'ht' || e.k === 'ft') FM.audio.whistle(e.k === 'ft');
    }
    if (m.htPause && !m.htSeen) { m.htSeen = true; S.paused = true; }
    if (!any) { S.ended = true; FM.audio.ambience(false); }
  }
  function endMatchday() {
    clearInterval(S.timer); const w = S.w, um = S.cur.userMatch;
    const res = um.h.score + '-' + um.a.score; const hn = um.h.short, an = um.a.short;
    FM.finishMatchday(w, S.cur); S.cur = null; S.ended = false; S.sel = null;
    FM.audio.setMode('menu'); FM.audio.ambience(false);
    if (w.phase === 'seasonEnd') { FM.endSeason(w); FM.save(w); S.screen = 'seasonEnd'; }
    else { S.screen = 'hub'; S.tab = 'home'; }
    render(); toast('Final: ' + hn + ' ' + res + ' ' + an); window.scrollTo(0, 0);
  }

<div class="card">${c ? `<h3>Editar club</h3><div class="grid g2" style="gap:8px"><label class="f">Nombre<input type="text" data-i="edc" data-f="name" data-id="${esc(c.id)}" value="${esc(c.name)}"></label><label class="f">Siglas<input type="text" maxlength="4" data-i="edc" data-f="short" data-id="${esc(c.id)}" value="${esc(c.short)}"></label>
<label class="f">Reputación (20-99)<input type="number" data-i="edc" data-f="rep" data-id="${esc(c.id)}" value="${c.rep}" min="20" max="99"></label><label class="f">Presupuesto (M€)<input type="number" data-i="edc" data-f="budget" data-id="${esc(c.id)}" value="${c.budget}" min="0"></label>
<label class="f">Color<input type="color" data-i="edc" data-f="color" data-id="${esc(c.id)}" value="${/^#[0-9a-f]{6}$/i.test(c.color) ? c.color : '#3ddc84'}"></label><label class="f">Liga<select data-i="edc" data-f="league" data-id="${esc(c.id)}">${P.leagues.map((l) => `<option value="${esc(l.id)}" ${l.id === c.league ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></label></div>
<div class="row" style="margin-top:10px"><button class="btn" data-a="edplayers" data-id="${esc(c.id)}">Ver jugadores (${P.players.filter((p) => p.club === c.id).length})</button><button class="btn danger" data-a="eddelclub" data-id="${esc(c.id)}">${E.confirm === 'club:' + c.id ? '¿Seguro? Pulsa otra vez' : 'Eliminar club'}</button></div>` : '<p class="mut">Elige un club de la lista.</p>'}</div></div>`;
    } else if (E.tab === 'players') {
      const q = E.q.toLowerCase().trim(); let list;
      if (q) list = P.players.filter((p) => p.name.toLowerCase().includes(q)).slice(0, 60); else list = P.players.filter((p) => p.club === E.club).sort((a, b) => FM.LINE[a.pos] - FM.LINE[b.pos] || b.ovr - a.ovr);
      const cname = (P.clubs.find((c) => c.id === E.club) || {}).name;
      body = `<div class="card"><div class="row sp" style="margin-bottom:8px"><select data-i="edclubsel"><option value="">— Club —</option>${P.clubs.slice().sort((a, b) => a.name.localeCompare(b.name)).map((c) => `<option value="${esc(c.id)}" ${c.id === E.club ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select><input type="search" data-i="edq" placeholder="Buscar jugador por nombre" value="${esc(E.q)}"><button class="btn sm" data-a="edaddpl" ${E.club ? '' : 'disabled'}>＋ Jugador</button></div>
<div class="mut sm" style="margin-bottom:6px">${q ? 'Resultados de búsqueda' : esc(cname || 'Elige un club')} · ${list.length} jugadores</div><div class="scroll ed-list"><table class="t"><thead><tr><th>Nombre</th><th>Pos</th><th>Edad</th><th>OVR</th><th>Pot</th><th>Club</th><th></th></tr></thead><tbody>${list.map((p) => `<tr><td><input type="text" data-i="edp" data-f="name" data-id="${esc(p.id)}" value="${esc(p.name)}" style="min-width:170px"></td><td><select data-i="edp" data-f="pos" data-id="${esc(p.id)}">${FM.POS.map((x) => `<option ${x === p.pos ? 'selected' : ''}>${x}</option>`).join('')}</select></td><td><input type="number" data-i="edp" data-f="age" data-id="${esc(p.id)}" value="${p.age}" style="width:62px"></td><td><input type="number" data-i="edp" data-f="ovr" data-id="${esc(p.id)}" value="${p.ovr}" style="width:62px"></td><td><input type="number" data-i="edp" data-f="pot" data-id="${esc(p.id)}" value="${p.pot}" style="width:62px"></td><td><select data-i="edp" data-f="club" data-id="${esc(p.id)}"><option value="">Libre</option>${P.clubs.map((c) => `<option value="${esc(c.id)}" ${c.id === p.club ? 'selected' : ''}>${esc(c.short)} · ${esc(c.name)}</option>`).join('')}</select></td><td><button class="btn sm danger" data-a="eddelpl" data-id="${esc(p.id)}">✕</button></td></tr>`).join('')}</tbody></table></div></div>`;
    } else {
      body = `<div class="card"><h3>Ligas</h3><p class="mut sm">Marca como "gran liga" las ligas donde se podrá modificar el presupuesto desde el juego.</p><div class="stack">${P.leagues.map((l) => `<div class="row"><input type="text" data-i="edl" data-f="name" data-id="${esc(l.id)}" value="${esc(l.name)}"><label class="row" style="gap:6px"><input type="checkbox" data-i="edl" data-f="big" data-id="${esc(l.id)}" ${l.big ? 'checked' : ''}> Gran liga</label><span class="mut sm">${P.clubs.filter((c) => c.league === l.id).length} clubes</span></div>`).join('')}</div></div>`;
    }
    return `<div style="height:16px"></div><div class="row sp"><h2>Editor de packs</h2><button class="btn sm" data-a="menu">← Menú</button></div>
<div class="card stack" style="margin:12px 0"><div class="grid g2" style="gap:8px"><label class="f">Cargar pack base<select data-i="edbase">${packs.map((p) => `<option value="${esc(p.id)}" ${p.id === S.packId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
<div class="grid" style="grid-template-columns:90px 1fr 80px;gap:8px"><label class="f">ID<input type="text" data-i="edmeta" data-f="id" value="${esc(P.meta.id)}"></label><label class="f">Nombre del mod<input type="text" data-i="edmeta" data-f="name" value="${esc(P.meta.name || '')}"></label><label class="f">Año<input type="number" data-i="edmeta" data-f="year" value="${P.meta.year || 2026}"></label></div></div>
<div class="row"><button class="btn pri" data-a="edsave">💾 Guardar en este navegador y usar</button><button class="btn" data-a="edexport">Exportar JSON</button></div>
<p class="mut sm" style="margin:0">Cambia el ID para no sobrescribir el pack base (ej. <b>2015</b>, <b>2020</b>). Los clubes sin plantilla completa se rellenan solos al jugar.</p></div>
<nav class="tabs" style="margin:0 0 10px">${[['clubs', 'Clubes'], ['players', 'Jugadores'], ['leagues', 'Ligas']].map(([k, n]) => `<button class="${E.tab === k ? 'on' : ''}" data-a="edtab" data-id="${k}">${n}</button>`).join('')}</nav>${body}`;
  }
  function edRaw() { // convierte el pack editado en JSON exportable
    const P = S.ed.pack; const out = { meta: Object.assign({}, P.meta, { autofill: true }), leagues: P.leagues, clubs: P.clubs, players: P.players };
    return FM.clone(out);
  }

  /* ---------- ACCIONES ---------- */
  function startNewGame() {
    const pk = expanded(S.packId); const club = pk.clubs.find((c) => c.id === S.club); if (!club) return;
    FM.seed((Date.now() ^ FM.hash(S.club)) >>> 0);
    S.w = FM.newWorld(FM.clone(pk), S.club, S.mgr.trim() || 'Míster'); FM.save(S.w); S.screen = 'hub'; S.tab = 'home'; S.sel = null; rerender();
  }
  function act(a, d, el) {
    const w = S.w;
    switch (a) {
      case 'menu': if (S.timer) clearInterval(S.timer); S.screen = 'menu'; S.cur = null; S.modal = null; S.ed = null; FM.audio.setMode('menu'); FM.audio.ambience(false); return render();
      case 'newgame': S.screen = 'setup'; S.club = null; return render();
      case 'continue': { const lw = FM.load(); if (!lw) return toast('No se pudo cargar la partida.'); S.w = lw; if (lw.phase === 'seasonEnd' && !lw.summary) { FM.endSeason(lw); FM.save(lw); } S.screen = lw.phase === 'seasonEnd' ? 'seasonEnd' : 'hub'; S.tab = 'home'; return render(); }
      case 'editor': S.ed = null; S.screen = 'editor'; return render();
      case 'lg': S.lg = d.id; S.club = null; return rerender(true);
      case 'pickclub': S.club = d.id; return rerender(true);
      case 'start': return startNewGame();
      case 'delmod': deleteMod(d.id); if (S.packId === d.id) S.packId = '2026'; return render();
      case 'mnext': FM.audio.next(); return render();
      case 'mmute': FM.audio.toggleMute(); return rerender(true);
      case 'mgen': FM.audio.useGenerated(); return rerender(true);
      case 'tab': S.tab = d.id; S.sel = null; return rerender();
      case 'beginseason': FM.startSeason(w); S.tab = 'home'; return rerender();
      case 'play': return startMatch();
      case 'sel': { const b = { z: d.z, i: +d.i, id: d.id }; if (!S.sel) { S.sel = b; } else if (S.sel.z === b.z && S.sel.i === b.i && S.sel.id === b.id) { S.sel = null; } else { swapSel(w, b); } return rerender(true); }
      case 'autoxi': FM.fixLineup(w, FM.userClub(w), true); FM.save(w); S.sel = null; return rerender(true);
      case 'msub': S.mkt.sub = d.id; return rerender(true);
      case 'offer': return openModal({ t: 'offer', id: d.id });
      case 'dobuy': { const f = $('#fee'); const r = FM.buy(w, d.id, f ? f.value : 0); toast(r.msg); if (r.ok) { FM.save(w); S.modal = null; } return rerender(true); }
      case 'bids': return openModal({ t: 'bids', id: d.id });
      case 'acceptbid': { const r = FM.acceptBid(w, d.id, +d.v); toast(r.msg); if (r.ok) { FM.save(w); S.modal = null; } return rerender(true); }
      case 'release': { const r = FM.release(w, d.id); toast(r.msg); if (r.ok) FM.save(w); return rerender(true); }
      case 'setbud': { const r = FM.setBudget(w, $('#bud').value); toast(r.msg); FM.save(w); return rerender(true); }
      case 'addbud': { const r = FM.setBudget(w, FM.userClub(w).budget + (+d.v)); toast(r.msg); FM.save(w); return rerender(true); }
      case 'savenow': toast(FM.save(w) ? 'Partida guardada' : 'No se pudo guardar en este navegador: usa "Exportar partida"'); return;
      case 'exportsave': return openModal({ t: 'json', title: 'Exportar partida', note: 'Guarda este texto en un archivo .json. Puedes importarlo desde el menú.', text: FM.exportSave(w), file: 'partida-futbolfm.json' });
      case 'jsoncopy': return copy($('#jsonbox').value);
      case 'jsondl': return download(S.modal.file || 'futbolfm.json', S.modal.text);
      case 'closemodal': return closeModal();
      case 'ovl': if (el === d._target) return closeModal(); return;
      case 'endmd': return endMatchday();
      case 'accept': { const r = FM.beginNextSeason(w, d.id || null); if (!r.ok) { toast(r.msg); return render(); } S.screen = 'hub'; S.tab = 'home'; S.sel = null; render(); toast('¡Nueva temporada ' + yy(w.year) + '!'); window.scrollTo(0, 0); return; }
      /* partido */
      case 'pause': S.paused = !S.paused; if (!S.paused) { S.last = performance.now(); if (S.cur.userMatch.htPause) FM.audio.whistle(); } return paintMatch(false);
      case 'speed': S.speed = +d.v; return paintMatch(false);
      case 'subs': return openModal({ t: 'subs', out: null, inn: null });
      case 'subout': S.modal.out = d.id; return rerender(true);
      case 'subin': S.modal.inn = d.id; return rerender(true);
      case 'dosub': { const mt = S.cur.userMatch; const side = mt.h.user ? 'h' : 'a'; const ok = FM.userSub(mt, side, S.modal.out, S.modal.inn); toast(ok ? 'Cambio realizado' : 'No se pudo hacer el cambio'); S.modal.out = S.modal.inn = null; if (ok) { S.evSeen = -1; } return rerender(true); }
      case 'tact': return openModal({ t: 'tact' });
      case 'mentality': { const mt = S.cur.userMatch; const T = mt.h.user ? mt.h : mt.a; T.mentality = d.v; FM.userClub(w).mentality = d.v; return rerender(true); }
      /* editor */
      case 'edtab': S.ed.tab = d.id; return rerender(true);
      case 'edclub': S.ed.club = d.id; S.ed.confirm = ''; return rerender(true);
      case 'edplayers': S.ed.club = d.id; S.ed.tab = 'players'; S.ed.q = ''; return rerender();
      case 'edaddclub': { const P = S.ed.pack; const lg = S.ed.lg; let n = 1, id; do { id = lg.toLowerCase() + '_nuevo' + n++; } while (P.clubs.some((c) => c.id === id)); P.clubs.push({ id, name: 'Club nuevo ' + (n - 1), short: 'NEW', league: lg, color: '#3ddc84', rep: 60, budget: FM.repToBudget(60) }); S.ed.club = id; return rerender(true); }
      case 'eddelclub': { if (S.ed.confirm !== 'club:' + d.id) { S.ed.confirm = 'club:' + d.id; return rerender(true); } const P = S.ed.pack; P.clubs = P.clubs.filter((c) => c.id !== d.id); P.players = P.players.filter((p) => p.club !== d.id); S.ed.club = null; S.ed.confirm = ''; return rerender(true); }
      case 'edaddpl': { const P = S.ed.pack; const id = 'custom_' + Date.now().toString(36) + Math.floor(Math.random() * 999); P.players.push({ id, name: 'Nuevo jugador', club: S.ed.club, pos: 'CM', age: 22, ovr: 65, pot: 72, nat: 'ENG' }); S.ed.q = ''; return rerender(true); }
      case 'eddelpl': S.ed.pack.players = S.ed.pack.players.filter((p) => p.id !== d.id); return rerender(true);
      case 'edsave': { const raw = edRaw(); if (!raw.meta.id) return toast('Pon un ID al pack.'); raw.meta.id = FM.slug(raw.meta.id) || 'mod'; try { FM.expandPack(raw); } catch (e) { return toast('Pack inválido: ' + e.message); } FM.registerPack(raw); delete S.exp[raw.meta.id]; const ok = saveMod(raw); S.packId = raw.meta.id; toast(ok ? 'Pack "' + (raw.meta.name || raw.meta.id) + '" guardado y listo para jugar.' : 'Disponible esta sesión; no cupo en el almacenamiento: usa Exportar JSON.'); return rerender(true); }
      case 'edexport': { const raw = edRaw(); return openModal({ t: 'json', title: 'Exportar pack', note: 'Guarda este texto como mods/' + (raw.meta.id || 'mod') + '.json', text: JSON.stringify(raw), file: (raw.meta.id || 'mod') + '.json' }); }
    }
  }
  function onInput(e) {
    const t = e.target, i = t.dataset.i; if (!i) return;
    const w = S.w;
    switch (i) {
      case 'pack': S.packId = t.value; S.lg = null; S.club = null; return rerender();
      case 'mgr': S.mgr = t.value; return;
      case 'vol': FM.audio.setVol(+t.value / 100); return;
      case 'formation': { const c = FM.userClub(w); c.formation = t.value; FM.fixLineup(w, c, true); FM.save(w); S.sel = null; return rerender(true); }
      case 'mentality': FM.userClub(w).mentality = t.value; FM.save(w); return;
      case 'lgview': S.lgView = t.value; return rerender(true);
      case 'mq': S.mkt.q = t.value; if (e.type === 'change') rerender(true); return;
      case 'mpos': S.mkt.pos = t.value; return rerender(true);
      case 'mleague': S.mkt.league = t.value; return rerender(true);
      case 'mmin': S.mkt.minOvr = t.value; if (e.type === 'change') rerender(true); return;
      case 'mage': S.mkt.maxAge = t.value; if (e.type === 'change') rerender(true); return;
      case 'mprice': S.mkt.maxPrice = t.value; if (e.type === 'change') rerender(true); return;
      case 'msort': S.mkt.sort = t.value; return rerender(true);
      case 'edbase': S.packId = t.value; S.ed = null; return rerender();
      case 'edlg': S.ed.lg = t.value; S.ed.club = null; return rerender(true);
      case 'edclubsel': S.ed.club = t.value; S.ed.q = ''; return rerender(true);
      case 'edq': S.ed.q = t.value; if (e.type === 'change') rerender(true); return;
      case 'edmeta': { if (e.type !== 'change') return; const f = t.dataset.f; S.ed.pack.meta[f] = f === 'year' ? (+t.value || 2026) : t.value; return; }
      case 'edc': { if (e.type !== 'change') return; const c = S.ed.pack.clubs.find((x) => x.id === t.dataset.id); if (!c) return; const f = t.dataset.f; c[f] = ['rep', 'budget'].includes(f) ? (+t.value || 0) : t.value; if (f === 'short') c.short = c.short.toUpperCase().slice(0, 4); if (f === 'league') S.ed.lg = c.league; return rerender(true); }
      case 'edp': { if (e.type !== 'change') return; const p = S.ed.pack.players.find((x) => x.id === t.dataset.id); if (!p) return; const f = t.dataset.f; p[f] = ['age', 'ovr', 'pot'].includes(f) ? (+t.value || 0) : f === 'club' ? (t.value || null) : t.value; return; }
      case 'edl': { if (e.type !== 'change') return; const l = S.ed.pack.leagues.find((x) => x.id === t.dataset.id); if (!l) return; l[t.dataset.f] = t.dataset.f === 'big' ? t.checked : t.value; return; }
      case 'modfile': return readFile(t, (txt) => { try { const raw = JSON.parse(txt); FM.registerPack(raw); FM.expandPack(raw); saveMod(raw); delete S.exp[raw.meta.id]; S.packId = raw.meta.id; toast('Mod "' + (raw.meta.name || raw.meta.id) + '" instalado.'); rerender(); } catch (er) { delete FM.packs[(JSON.parse(txt || '{}').meta || {}).id]; toast('Mod inválido: ' + er.message); } });
      case 'savefile': return readFile(t, (txt) => { try { S.w = FM.importSave(txt); FM.save(S.w); if (S.w.phase === 'seasonEnd' && !S.w.summary) FM.endSeason(S.w); S.screen = S.w.phase === 'seasonEnd' ? 'seasonEnd' : 'hub'; S.tab = 'home'; render(); toast('Partida importada.'); } catch (er) { toast('No se pudo importar: ' + er.message); } });
      case 'musicfile': FM.audio.addFiles(t.files); return rerender(true);
    }
  }
  function readFile(inp, cb) { const f = inp.files && inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => cb(String(r.result)); r.readAsText(f); inp.value = ''; }

  /* ---------- arranque ---------- */
  document.addEventListener('click', (e) => {
    if (!FM.audio.ready) FM.audio.start();
    const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
    if (el.dataset.a === 'ovl') { if (e.target === el) closeModal(); return; }
    e.preventDefault(); act(el.dataset.a, el.dataset, el);
  });
  document.addEventListener('change', (e) => { try { onInput(e); } catch (er) { console.error(er); toast('Error: ' + er.message); } });
  document.addEventListener('input', (e) => { if (['mgr', 'vol', 'mq', 'edq'].includes(e.target.dataset.i) && e.target.type !== 'search') { try { onInput(e); } catch (er) {} } else if (e.target.dataset.i === 'mq' || e.target.dataset.i === 'edq') { onInput(e); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.target.dataset.i === 'mq' || e.target.dataset.i === 'edq')) { onInput({ target: e.target, type: 'change' }); } if (e.key === 'Escape' && S.modal) closeModal(); });
  window.addEventListener('error', (e) => { console.error(e.error || e.message); });
  loadMods();
  render();
  FM.ui = { S, render };
})();

</script>
</body>
</html>
